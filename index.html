<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowRider® Registration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Signature Pad CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/1.5.3/signature_pad.min.js"></script>
    <!-- Flatpickr CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    <style>
        /* ใช้ฟอนต์ Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* ซ่อน scrollbar ของ textarea ข้อตกลง */
        #agreement-text::-webkit-scrollbar {
            display: none;
        }
        #agreement-text {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* สไตล์สำหรับ Signature Pad */
        .signature-pad-container {
            border: 2px dashed #cbd5e1; /* gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #f8fafc; /* gray-50 */
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* ปุ่มล้างลายเซ็น */
        #clear-signature {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.875rem;
            padding: 4px 8px;
        }
    </style>
    <!-- โหลดฟอนต์ Inter และ Sarabun จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- เพิ่ม class "relative" เพื่อให้ปุ่มเมนูจัดตำแหน่งได้ -->
    <div class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden relative">

        <!-- ===== [แก้ไขใหม่] ซ่อน Link to Details Page แบบลับๆ (กดที่มุมขวาบน) ===== -->
        <a href="detail.html" target="_blank" id="admin-link" class="absolute top-0 right-0 w-16 h-16 z-10 opacity-0 cursor-default" title="">
            <span class="sr-only">ดูข้อมูลการลงทะเบียน</span>
        </a>
        <!-- ===== [สิ้นสุดส่วนที่แก้ไขใหม่] ===== -->


        <!-- ===== Page 1: Language Selection ===== -->
        <div id="language-page" class="p-8 md:p-12 text-center">
            <!-- Logo (อัปเดตตาม URL ที่คุณให้มา) -->
            <img src="https://img2.pic.in.th/pic/logo-resize.webp" alt="Logo" class="mx-auto mb-8 w-48 md:w-64">
            
            <h2 id="lang-title" class="text-2xl md:text-3xl font-bold text-gray-800 mb-8">Please select a language.</h2>
            
            <div class="flex justify-center gap-6">
                <!-- TH Button -->
                <button onclick="goToAgreement('th')" class="flex flex-col items-center justify-center w-24 h-24 md:w-32 md:h-32 bg-blue-500 text-white rounded-full shadow-lg transition-transform transform hover:scale-105 hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    <svg class="w-8 h-8 md:w-10 md:h-10 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    <span class="text-xl md:text-2xl font-bold">TH</span>
                </button>
                <!-- EN Button -->
                <button onclick="goToAgreement('en')" class="flex flex-col items-center justify-center w-24 h-24 md:w-32 md:h-32 bg-blue-500 text-white rounded-full shadow-lg transition-transform transform hover:scale-105 hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    <svg class="w-8 h-8 md:w-10 md:h-10 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    <span class="text-xl md:text-2xl font-bold">EN</span>
                </button>
            </div>
        </div>

        <!-- ===== Page 2: Agreement ===== -->
        <div id="agreement-page" class="p-8 md:p-12 hidden">
            <h2 id="agreement-title" class="text-2xl font-bold text-gray-800 mb-4 text-center"></h2>
            
            <!-- Agreement Text Box -->
            <div id="agreement-text" class="h-64 md:h-80 overflow-y-auto border border-gray-300 rounded-lg p-4 bg-gray-50 text-gray-700 text-sm mb-6">
                <!-- Content will be inserted by JavaScript from fetched data -->
            </div>
            
            <!-- Agreement Checkbox -->
            <div class="flex items-center mb-6">
                <input id="agreement-checkbox" type="checkbox" class="h-5 w-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label id="agreement-label" for="agreement-checkbox" class="ml-3 block text-sm md:text-base font-medium text-gray-700"></label>
            </div>
            
            <!-- Navigation Buttons -->
            <div class="flex justify-between">
                <button id="agreement-back" onclick="goToLanguage()" class="py-2 px-6 bg-gray-200 text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-300 transition duration-300"></button>
                <button id="agreement-next" onclick="goToForm()" class="py-2 px-6 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed" disabled></button>
            </div>
        </div>

        <!-- ===== Page 3: Registration Form ===== -->
        <div id="form-page" class="p-8 md:p-12 hidden">
            <h2 id="form-title" class="text-2xl font-bold text-gray-800 mb-6 text-center"></h2>
            
            <form id="registration-form" novalidate>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                    <!-- First Name -->
                    <div>
                        <label id="label-firstName" for="firstName" class="block text-sm font-medium text-gray-700"></label>
                        <input type="text" id="firstName" name="firstName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <!-- Last Name -->
                    <div>
                        <label id="label-lastName" for="lastName" class="block text-sm font-medium text-gray-700"></label>
                        <input type="text" id="lastName" name="lastName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <!-- Date of Birth -->
                    <div>
                        <label id="label-dob" for="dob" class="block text-sm font-medium text-gray-700"></label>
                        <input type="text" id="dob" name="dob" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
                    </div>
                    <!-- Age -->
                    <div>
                        <label id="label-age" for="age" class="block text-sm font-medium text-gray-700"></label>
                        <input type="text" id="age" name="age" readonly class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100 focus:outline-none">
                    </div>
                    <!-- Emergency Contact Name -->
                    <div class="md:col-span-2">
                        <label id="label-emergencyName" for="emergencyName" class="block text-sm font-medium text-gray-700"></label>
                        <input type="text" id="emergencyName" name="emergencyName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <!-- Emergency Contact Phone -->
                    <div class="md:col-span-2">
                        <label id="label-emergencyPhone" for="emergencyPhone" class="block text-sm font-medium text-gray-700"></label>
                        <input type="tel" id="emergencyPhone" name="emergencyPhone" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <!-- Signature Pad -->
                    <div class="md:col-span-2">
                        <label id="label-signature" class="block text-sm font-medium text-gray-700 mb-1"></label>
                        <div class="signature-pad-container">
                            <canvas id="signature-canvas"></canvas>
                            <button type="button" id="clear-signature" class="bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300"></button>
                        </div>
                        <input type="hidden" id="signature-data" name="signature">
                    </div>
                </div>
                
                <!-- Form Buttons -->
                <div class="flex justify-between mt-8">
                    <button id="form-back" type="button" onclick="showPage('agreement-page')" class="py-2 px-6 bg-gray-200 text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-300 transition duration-300"></button>
                    <button id="form-submit" type="submit" class="py-2 px-6 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 transition duration-300"></button>
                </div>
            </form>
        </div>

        <!-- ===== Page 4: Success Message ===== -->
        <div id="success-page" class="p-8 md:p-12 text-center hidden">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 id="success-title" class="text-2xl font-bold text-gray-800 mb-4"></h2>
            <p id="success-message" class="text-gray-600 mb-8"></p>
            <button id="success-button" onclick="resetApp()" class="py-2 px-6 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition duration-300"></button>
        </div>

        <!-- ===== Page 5: Error Message ===== -->
        <div id="error-page" class="p-8 md:p-12 text-center hidden">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 id="error-title" class="text-2xl font-bold text-gray-800 mb-4"></h2>
            <p id="error-message" class="text-gray-600 mb-8"></p>
            <button id="error-button" onclick="showPage('form-page')" class="py-2 px-6 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition duration-300"></button>
        </div>
    </div>

    <!-- ===== Loading Overlay ===== -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="w-16 h-16 border-4 border-t-blue-500 border-gray-200 rounded-full animate-spin"></div>
        <span id="loading-text" class="text-white ml-4 text-lg font-semibold">Loading...</span>
    </div>

    <!-- ===== JavaScript ===== -->
    <script>
        // --- Globals ---
        let selectedLang = 'en';
        let signaturePad;
        let fpInstance = null; // ตัวแปรเก็บ Flatpickr
        const appScriptUrl = 'https://script.google.com/macros/s/AKfycbyrreHAORaQtEx36gZqSJ-h6OuUojYYyJlIILi6aHKcJMNEP3fkYXAzo8ZjOQ6UEp-xfA/exec';
        
        // ข้อความข้อตกลง (ฝังในไฟล์ HTML โดยตรงเพื่อความรวดเร็ว ไม่ต้องดึงจาก Sheet)
        // **ให้นำข้อความข้อตกลงภาษาไทยและอังกฤษมาวางที่นี่แทน (ใช้ <br> สำหรับขึ้นบรรทัดใหม่)**
                let agreementData = {
            th: `
โฟลว์ไรเดอร์จัดเป็นเครื่องเล่นกีฬาผาดโผนและมีความเสี่ยงสูง คลื่นจำลองที่ผลิตโดยเครื่องโฟลว์ไรเดอร์อาจส่งผลให้ ผู้เล่นได้รับบาดเจ็บทั้งทางร่างกายและจิตใจ หรืออาจก่อให้เกิดอาการเจ็บป่วย โรคภัย หรืออาจทำให้ถึงแก่ชีวิต<br>
<br>
เอกสารนี้เกี่ยวข้องกับสิทธิตามกฎหมายของท่าน การลงลายมือชื่อท้ายเอกสารเป็นเครื่องแสดงว่าท่านได้อ่านและทำความเข้าใจความเสี่ยงทั้งปวงที่อาจเกิดขึ้นจากการใช้เครื่องเล่นดังกล่าวแล้ว          และยินยอมรับความเสี่ยงเหล่านั้นโดยสมัครใจและตกลงที่จะผูกพันตนตามข้อกำหนดทั้งปวงที่ระบุในข้อตกลงว่าด้วยการปลดเปลื้องความรับผิดและการชดใช้ค่าเสียหายฉบับนี้<br>
<br>
ลายมือชื่อของข้าพเจ้าท้ายเอกสารนี้เป็นเครื่องแสดงว่าข้าพเจ้าหรือผู้เยาว์ซึ่งอยู่ในการปกครองของข้าพเจ้าในฐานะผู้ปกครองได้สมัครใจที่จะเข้าใช้เครื่องเล่นโต้คลื่นที่มีชื่อว่าโฟลว์ไรเดอร์หรืออุปกรณ์โฟลว์บอร์ด (เรียกรวมกันว่า “การใช้เครื่องเล่น”) ตลอดจนใช้อุปกรณ์และเครื่องเล่นต่างๆ ของสวนน้ำวานานาวา ทั้งนี้ รวมถึงแต่ไม่จำกัดเพียงเครื่องเล่นโฟลว์ไรเดอร์ (เรียกรวมกันว่า “เครื่องเล่น”)<br>
<br>
เพื่อให้ได้รับอนุญาตใช้เครื่องเล่นดังกล่าว ข้าพเจ้ารับรู้ ยินยอม ตกลง และให้สัญญาในนามของข้าพเจ้า ทายาท ผู้ได้รับมอบหมาย ผู้แทน ตลอดจนกองมรดกของข้าพเจ้า ต่อโฟลว์ไรเดอร์ อิงค์, อควาติก ดีเวลอปเมนต์ กรุ๊ป อิงค์ และบริษัท วานา นาวา หัวหิน จำกัด รวมถึงผู้ให้เช่า สำนักงานใหญ่ของบริษัท บริษัทในเครือ บริษัทอื่นๆ ที่เกี่ยวข้อง ตลอดจนบุคคลหรือนิติบุคคลที่เกี่ยวข้องกับธุรกิจของบริษัท ทั้งในอดีตและปัจจุบัน รวมถึงหุ้นส่วน ผู้จัดการทรัพย์สิน กรรมการ เจ้าหน้าที่ สมาชิก ผู้ครอบครอบสิทธิ์ในทรัพย์สินทางปัญญา ตัวแทน ผู้รับมอบอำนาจ ตลอดจนลูกจ้างและพนักงานของบุคคลหรือนิติบุคคลที่กล่าวมาข้างต้น ทั้งในอดีตและปัจจุบัน (เรียกรวมกันว่า “ผู้ได้รับการปลดเปลื้อง”) ดังต่อไปนี้<br>
 <br>
การตระหนักถึงความเสี่ยง: ข้าพเจ้าเข้าใจและตระหนักดีว่าการใช้เครื่องเล่นที่ข้าพเจ้ากำลังจะเข้าใช้โดยสมัครใจนี้มีความเสี่ยง ทั้งความเสี่ยงที่ข้าพเจ้าได้ทราบดีอยู่แล้ว รวมถึงความเสี่ยงที่มิอาจคาดการณ์ได้ โดยความเสี่ยงดังกล่าวอาจส่งผลให้ทรัพย์สินของข้าพเจ้าได้รับความเสียหาย ทั้งยังอาจส่งผลให้ข้าพเจ้าได้รับบาดเจ็บทั้งทางร่างกายและจิตใจและอาจนำมาซึ่งอาการเจ็บป่วย โรคภัย รวมไปจนถึงการเสียชีวิต ซึ่งข้าพเจ้าเข้าใจและตระหนักดีว่าความเสี่ยงดังกล่าวอาจก่อให้เกิดการเรียกร้องบางประการกับผู้ได้รับการปลดเปลื้อง อย่างไรก็ดี ข้าพเจ้าเป็นผู้แสดงความสมัครใจเลือกที่จะแบกรับความเสี่ยงดังกล่าวไว้เอง โดยมุ่งพิจารณาที่ความสนุกสนาน ความตื่นเต้น และประโยชน์อื่นใดอันเกิดจากการใช้เครื่องเล่นเป็นสำคัญ โดยเห็นว่าประโยชน์ทั้งปวงอันข้าพเจ้าจะพึงได้รับจากการใช้เครื่องเล่นดังกล่าวมีความสำคัญต่อข้าพเจ้ามากกว่าความเสี่ยงต่างๆ ที่อาจเกิดขึ้นจากการใช้เครื่องเล่น ความเสี่ยงที่กล่าวถึงในส่วนนี้อาจรวมถึงแต่ไม่จำกัดเพียง<br>
<br>
(1) การกระทำ การละเว้นการกระทำ หรือการประมาทเลินเล่อในทุกรูปแบบของผู้ได้รับการปลดเปลื้อง หรือตัวแทน หรือพนักงานของผู้ได้รับการปลดเปลื้อง (2) ความเสี่ยงอันเป็นธรรมชาติของการใช้เครื่องเล่น ซึ่งรวมถึงแต่ไม่จำกัดเพียง ก) กระดูกหัก ข) ข้อเคลื่อน ค) เส้นเอ็นฉีกขาด ง) อาการเคล็ดขัดยอก จ) บาดแผลบริเวณศีรษะ ร่างกาย และ/หรือ แขนขา ฉ) เล็บฉีก และ ช) อาการบวมฟกช้ำ อันเกิดจากการใช้เครื่องเล่นดังกล่าว (3) ความชำรุดบกพร่องหรือสภาพของเครื่องเล่นและการใช้เครื่องเล่นทั้งที่เห็นได้ชัดแจ้งและไม่ชัดแจ้ง (4) การให้คำแนะนำและการดูแลที่ไม่เหมาะสมหรือไม่เพียงพอเกี่ยวกับเครื่องเล่นและการใช้เครื่องเล่น (5) พฤติกรรมของผู้ใช้เครื่องเล่นรายอื่น (6) อุบัติเหตุหรือพฤติการณ์ที่เกิดขึ้นขณะใช้เครื่องเล่น รวมถึงแต่ไม่จำกัดเพียงอุบัติเหตุหรือพฤติการณ์ที่เกิดขึ้นในพื้นที่เปียก เช่น บริเวณพื้นที่รอบสระน้ำ พื้นผิวที่ปูกระเบื้องหรือพื้นผิวคอนกรีตที่เปียกน้ำ (7) การปฐมพยาบาล การให้ความช่วยเหลือกรณีฉุกเฉิน หรือบริการใดๆ ที่ผู้ได้รับการปลดเปลื้อง หรือตัวแทน หรือพนักงานของผู้ได้รับการปลดเปลื้องได้กระทำหรือมิได้กระทำ<br>
<br>
ข้าพเจ้าเข้าใจและตระหนักว่าความเสี่ยงที่กล่าวมาข้างต้นเป็นเพียงตัวอย่างของความเสี่ยงเท่านั้นและอาจไม่ครอบคลุมความเสี่ยงอื่นๆ ที่รู้หรือไม่รู้ พบหรือไม่พบ คาดการณ์ได้หรือคาดการณ์ไม่ได้ ซึ่งอาจส่งผลให้ทรัพย์สินของข้าพเจ้าได้รับความเสียหาย ทั้งยังอาจส่งผลให้ข้าพเจ้าได้รับบาดเจ็บทั้งทางร่างกายและจิตใจและอาจนำมาซึ่งอาการเจ็บป่วย โรคภัย รวมไปจนถึงการเสียชีวิต อนึ่ง ข้าพเจ้ายังตระหนักว่าข้าพเจ้าเป็นผู้มีสุขภาพกายและใจแข็งแรงและมิได้เจ็บป่วยด้วยโรคภัยหรืออาการผิดปกติใดๆ ซึ่งอาจส่งผลต่อการเล่นหรือใช้เครื่องเล่นดังกล่าว นอกจากนี้ ข้าพเจ้ายังตระหนักอีกว่าข้าพเจ้ามิได้ซื้อหรือเช่าเครื่องเล่นแต่อย่างใด หากแต่เพียงได้สิทธิไม่เป็นการเฉพาะตัวในการใช้เครื่องเล่นเพียงชั่วคราวเท่านั้น โดยข้าพเจ้าทราบดีว่าผู้ได้รับการปลดเปลื้องเป็นเพียงผู้ให้บริการสถานที่เพื่อการพักผ่อนหย่อนใจเท่านั้น<br>
<br>
การยอมรับและความเข้าใจโดยสมัครใจถึงความเสี่ยงและความรับผิดชอบ: ข้าพเจ้ายินยอม ตกลง และสัญญาโดยชัดแจ้งและสมัครใจที่จะเป็นผู้รับผิดชอบและรับความเสี่ยงทั้งปวงซึ่งอาจส่งผลให้ทรัพย์สินของข้าพเจ้าได้รับความเสียหาย ทั้งยังอาจส่งผลให้ข้าพเจ้าได้รับบาดเจ็บทั้งทางร่างกายและจิตใจและอาจนำมาซึ่งอาการเจ็บป่วย โรคภัย รวมไปจนถึงการเสียชีวิต อันเป็นผลจากการเข้ามีส่วนเกี่ยวข้องหรือใช้เครื่องเล่นดังกล่าว<br>
<br>
การปลดเปลื้องและการชดใช้ค่าเสียหาย: โดยความสมัครใจของข้าพเจ้า ณ บัดนี้จวบจนตลอดไป ข้าพเจ้าขอปลดเปลื้องและตกลงที่จะไม่ฟ้องร้องดำเนินคดีกับผู้ได้รับการปลดเปลื้อง รวมตลอดจนบุคคลหรือนิติบุคคลใดๆ ที่มีความเกี่ยวข้องกับผู้ได้รับการปลดเปลื้องในพฤติการณ์ทั้งปวงที่เกี่ยวข้องกับความรับผิด ข้อเรียกร้อง การดำเนินการ หรือสิทธิอย่างหนึ่งอย่างใดในการดำเนินการซึ่งเกี่ยวข้อง มีสาเหตุจาก หรือมีความเกี่ยวโยงกับเครื่องเล่นหรือการใช้เครื่องเล่น ทั้งนี้ รวมถึงแต่ไม่จำกัดเพียงพฤติการณ์อันเกิดจากความประมาทเลินเล่อหรือความผิดของผู้ได้รับการปลดเปลื้อง อนึ่ง ข้าพเจ้าตระหนักดีว่าเอกสารปลดเปลื้องฉบับนี้จะสามารถใช้บังคับได้ตลอดไปและจะใช้บังคับกับการมีส่วนเกี่ยวข้องกับเครื่องเล่นและการใช้เครื่องเล่นทั้งในปัจจุบันและอนาคต ข้าพเจ้าเข้าใจดีว่าการปลดเปลื้องความรับผิดตามข้อตกลงนี้จะส่งผลให้ข้าพเจ้า บุตร ทายาท หรือกองมรดกของข้าพเจ้าไม่สามารถดำเนินคดีฟ้องร้องหรือเรียกร้องค่าเสียหายใดๆ จากการบาดเจ็บหรือเสียชีวิตอันเกิดจากเครื่องเล่นหรือการใช้งานเครื่องเล่นดังกล่าว<br>
<br>

        // --- Form Functions ---
        function calculateAge() {
            const dobInput = document.getElementById('dob').value;
            if (dobInput) {
                const dob = new Date(dobInput);
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const m = today.getMonth() - dob.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                    age--;
                }
                document.getElementById('age').value = age;
            }
        }

        function generateUUID() {
            // A simple UUID generator
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        function getFormattedDateTime(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const formattedDate = `${dd}/${mm}/${yyyy}`; // Format DD/MM/YYYY
            
            const formattedTime = date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            return { date: formattedDate, time: formattedTime };
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const t = translations[selectedLang];

            // Client-side validation
            if (!form.checkValidity()) {
                form.reportValidity();
                alert(t.validationGeneric);
                return;
            }

            if (signaturePad.isEmpty()) {
                alert(t.validationSignature);
                return;
            }

            showLoading(true, translations[selectedLang].submitButton + '...');

            // Get form data
            const formData = new FormData(form);
            const signatureData = signaturePad.toDataURL(); // Base64 PNG
            const now = new Date();
            const { date, time } = getFormattedDateTime(now);

            // --- เตรียมข้อมูลส่ง Google Sheet ---
            const dataToSubmit = new FormData();
            dataToSubmit.append('ID', generateUUID());
            dataToSubmit.append('ชื่อ', formData.get('firstName'));
            dataToSubmit.append('นามสกุล', formData.get('lastName'));
            dataToSubmit.append('วันเกิด', formData.get('dob')); 
            dataToSubmit.append('อายุ', formData.get('age'));
            dataToSubmit.append('ชื่อผู้ติดต่อกรณีฉุกเฉิน', formData.get('emergencyName'));
            dataToSubmit.append('หมายเลขติดต่อกรณีฉุกเฉิน', formData.get('emergencyPhone'));
            dataToSubmit.append('เวลา', time);
            dataToSubmit.append('ลายเซ็น', signatureData); 
            dataToSubmit.append('วันที่', date);


            // --- ส่งข้อมูลไปยัง Google Apps Script (POST) ---
            try {
                // เราต้องส่งแบบ 'POST' ไปยัง doPost
                const response = await fetch(appScriptUrl, {
                    method: 'POST',
                    body: dataToSubmit,
                });
                
                const result = await response.json(); 

                if (result.status === 'success') {
                    showLoading(false);
                    showPage('success-page');
                    resetForm();
                } else {
                    throw new Error(result.message || 'Unknown error');
                }

            } catch (error) {
                console.error('Error submitting form:', error);
                showLoading(false);
                // แสดงข้อความ error ที่ได้จาก Apps Script (ถ้ามี)
                document.getElementById('error-message').textContent = `${translations[selectedLang].errorMessage} (${error.message})`;
                showPage('error-page');
            }
        }
        
        function resetForm() {
            document.getElementById('registration-form').reset();
            if(signaturePad) signaturePad.clear();
            document.getElementById('age').value = '';
            document.getElementById('agreement-checkbox').checked = false;
            document.getElementById('agreement-next').disabled = true;
        }
        
        function resetApp() {
            resetForm();
            showPage('language-page');
        }

        // --- Signature Pad Functions ---
        function initSignaturePad() {
            const canvas = document.getElementById('signature-canvas');
            signaturePad = new SignaturePad(canvas, {
                backgroundColor: 'rgb(248, 250, 252)', // bg-gray-50
                penColor: 'rgb(0, 0, 0)'
            });
            document.getElementById('clear-signature').addEventListener('click', () => {
                signaturePad.clear();
            });
        }

        function resizeCanvas() {
            if (signaturePad) {
                const canvas = document.getElementById('signature-canvas');
                const ratio =  Math.max(window.devicePixelRatio || 1, 1);
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                canvas.getContext("2d").scale(ratio, ratio);
                signaturePad.clear(); // เคลียร์ canvas หลัง resize
            }
        }

        // --- Event Listeners ---
        window.addEventListener('resize', resizeCanvas);
        
        document.getElementById('agreement-checkbox').addEventListener('change', (e) => {
            document.getElementById('agreement-next').disabled = !e.target.checked;
        });

        document.getElementById('dob').addEventListener('change', calculateAge);

        document.getElementById('registration-form').addEventListener('submit', handleFormSubmit);
